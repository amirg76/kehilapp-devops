# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION / server compose — runs on the EC2 box.
#
# Difference from the local file: it does NOT build anything. It PULLS
# pre-built, tagged images from the GitHub Container Registry (GHCR) that the
# CI/CD pipeline pushed. The server stays dumb: pull image, restart container.
#
#     docker compose -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.prod.yml up -d
#
# Config comes entirely from an .env file sitting next to this one on the server
# (see runbooks/00-initial-server-setup.md). Never commit that .env.
#
# TLS: Caddy is the public entry point (ports 80/443) and terminates HTTPS
# automatically via Let's Encrypt, then proxies to the internal nginx edge.
# See runbooks/05-ssl-with-caddy.md. Prefer Caddy over the plain-HTTP proxy here.
# ─────────────────────────────────────────────────────────────────────────────

name: kehilapp

# ── Container baseline (added 2026-11-03) ───────────────────────────────────
# Every service merges this block. What each line buys:
#   no-new-privileges  a process can never gain privileges it did not start
#                      with (setuid binaries, file capabilities are ignored).
#   cap_drop ALL       start from zero Linux capabilities; each service adds
#                      back only what it was measured to need (cap_add below).
#   logging local      Docker's json-file default never rotates: the idle
#                      mongo container wrote a 312 MB log in 5 days. `local`
#                      rotates and compresses; 3 files x 10 MB per container.
# The cap_add sets were tested on the server with throwaway containers before
# this file changed (runbooks/00, "Hardening pass 2026-11-03"): nginx needs
# CHOWN/SETUID/SETGID (master as root, workers drop to the nginx user) plus
# NET_BIND_SERVICE for :80; mongo's entrypoint needs CHOWN/SETUID/SETGID to
# hand /data/db to uid 999; the backend runs as `node` and needs none.
x-baseline: &baseline
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongo:
    <<: *baseline
    # DAC_OVERRIDE: the entrypoint runs `find /data/db ! -user mongodb` as
    # root, and the EXISTING data dirs are mode 700 owned by uid 999. Without
    # it: "find: '/data/db/journal': Permission denied" and a restart loop
    # (3.11 deploy). The throwaway test missed it: its volume was empty.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    # Measured 107 MiB / 35 pids idle (3.11). mongod sizes its cache from
    # this limit, not from the host's 16 GB.
    mem_limit: 1g
    pids_limit: 200
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [kehilnet]

  backend:
    <<: *baseline
    # Runs as `node` (uid 1000) with zero effective capabilities already.
    # Measured 54 MiB / 12 pids idle (3.11). Uploads are held in memory by
    # multer (memoryStorage, 1 file, 5 MB max); nginx's 25m body limit is
    # only the outer cap. See runbooks/00, "Hardening pass 2026-11-03", for
    # the upload test under this limit.
    mem_limit: 512m
    pids_limit: 100
    image: ${REGISTRY:-ghcr.io/OWNER}/kehilapp-backend:${TAG:-latest}
    restart: always
    # Docker's own init (tini) as PID 1: reaps zombies and forwards signals so
    # `docker stop` shuts Node down cleanly. The image no longer installs tini
    # itself — that RUN step was the one thing keeping its arm64 build from
    # working without QEMU (see docker/backend.Dockerfile).
    init: true
    environment:
      NODE_ENV: production
      PORT: "5001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Self-hosted Mongo on the same box by default. To use Atlas, put the full
      # SRV connection string in the server .env and it overrides this line.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kehilapp}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the server .env}
      BUCKET_NAME: ${BUCKET_NAME}
      BUCKET_REGION: ${BUCKET_REGION}
      BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY}
      BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      # S3-compatible store (Cloudflare R2, MinIO). Empty = plain AWS S3, the
      # SDK derives the host from BUCKET_REGION. This block names every
      # variable the container gets, so a new one the backend learns to read
      # must be added HERE too: on 29.10 the server .env had this set and the
      # container never saw it (4 BUCKET_ vars inside, 0 BUCKET_ENDPOINT).
      BUCKET_ENDPOINT: ${BUCKET_ENDPOINT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: "true"      # cookies only over HTTPS in production
      # ── Added 2026-09-28: everything the server has learned to read since
      #    this file was written (31.8). Each `:?` one makes `compose up` stop
      #    with the message instead of the server refusing to boot later.
      #
      # Where the /verify-email link in every email points: the PUBLIC SITE's
      # origin, not this API. The server refuses to start without it in
      # production, because the default would mail strangers a localhost link.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to the public site origin, e.g. https://kehilapp.example.com}
      # Real mail. Without a provider the link is only written to the log and
      # nobody can finish registration.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY (Resend dashboard)}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, an address on a domain verified in Resend}
      # AI category/urgency suggestion in the admin panel. Optional: without a
      # key the button reports that the feature is off. Set a spend cap at
      # Anthropic as well — the per-account limiter here is the only other one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Client → Caddy → nginx "proxy" → backend = TWO proxies. Every rate limiter
      # keys on the client address, and the address is read from X-Forwarded-For
      # by skipping this many trusted hops. With 1 (the old hard-coded value)
      # every client resolved to Caddy's address and ten wrong passwords from
      # anyone locked everyone out. Change this if you change the chain.
      TRUST_PROXY_HOPS: "2"
      # Never set EXPOSE_VERIFICATION_LINK here: the server refuses to boot with
      # it in production, and rightly so — it returns verification tokens to
      # whoever asks.
    depends_on:
      mongo:
        condition: service_healthy
    networks: [kehilnet]

  frontend:
    <<: *baseline
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 64m      # measured 4.5 MiB / 5 pids (3.11)
    pids_limit: 50
    image: ${REGISTRY:-ghcr.io/OWNER}/kehilapp-frontend:${TAG:-latest}
    restart: always
    volumes:
      - ./docker/nginx/spa.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [kehilnet]

  admin:
    <<: *baseline
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 64m      # measured 4.4 MiB / 5 pids (3.11)
    pids_limit: 50
    image: ${REGISTRY:-ghcr.io/OWNER}/kehilapp-admin:${TAG:-latest}
    restart: always
    volumes:
      - ./docker/nginx/spa.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [kehilnet]

  # Internal path-routing edge (private). Caddy sits in front of THIS.
  proxy:
    <<: *baseline
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 64m      # measured 4.5 MiB / 5 pids (3.11)
    pids_limit: 50
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend, admin]
    networks: [kehilnet]

  # Public TLS terminator. Reads Caddyfile → gets/renews certs automatically.
  caddy:
    <<: *baseline
    # Runs as root inside the container; with cap_drop ALL it keeps only the
    # right to bind 80/443. Only this service's AWS path (prod.yml alone) uses
    # it: docker/caddy/Caddyfile passed `caddy validate` on 2.11.7 and the
    # image+caps served :80 in a throwaway test (3.11); a full AWS deploy with
    # this file has not run.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 100
    image: caddy:2.11-alpine   # pinned minor, see shared-proxy/docker-compose.yml
    restart: always
    environment:
      # Injected into the container so the Caddyfile's {$DOMAIN}/{$ACME_EMAIL}
      # resolve. Values come from the server .env (see .env.example).
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persisted certs — do NOT delete or you re-issue
      - caddy_config:/config
    depends_on: [proxy]
    networks: [kehilnet]

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  kehilnet:
    driver: bridge
