# ─────────────────────────────────────────────────────────────────────────────
# Edge reverse proxy — the single front door for the whole stack (port 80).
#
# One public port, three internal services. nginx looks at the URL path and
# forwards to the right container over the private docker network:
#
#     https://your-domain/          → frontend  (public site)
#     https://your-domain/admin     → admin     (admin panel)
#     https://your-domain/api/...   → backend   (Express API, port 5001)
#
# The service names below (frontend / admin / backend) are the docker-compose
# service names — docker's built-in DNS resolves them to the right container.
#
# In PRODUCTION you normally put Caddy (auto-HTTPS) in front of this instead —
# see runbooks/05-ssl-with-caddy.md. This file is the plain-HTTP version used
# by docker-compose.yml for local full-stack testing.
# ─────────────────────────────────────────────────────────────────────────────

upstream backend_api  { server backend:5001; }
upstream frontend_web { server frontend:80; }
upstream admin_web    { server admin:80; }

server {
    listen 80;
    server_name _;

    # Uploads can be large-ish (images). Raise from nginx's 1MB default.
    client_max_body_size 25m;

    # ── API ──────────────────────────────────────────────────────────────────
    # The backend mounts its routes UNDER /api (src/app.js: app.use('/api/auth',
    # …), app.use('/api/messages', …)). So the prefix must reach it intact.
    #
    # This line used to be `proxy_pass http://backend_api/;` — with a trailing
    # slash, nginx replaces the matched `/api/` with `/`, and the backend
    # received /messages for /api/messages: a 404 on every call from the public
    # site. It was written for a backend that mounted at the root; this one
    # never did. No URI part on proxy_pass = the request path is passed as-is.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # httpOnly auth cookies flow straight through — nothing to configure.
    }

    # Direct health probe passthrough (handy for uptime monitors).
    location /healthz { proxy_pass http://backend_api/healthz; }
    location /readyz  { proxy_pass http://backend_api/readyz;  }

    # ── Admin panel ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://admin_web/;
        proxy_set_header Host $host;
    }

    # ── Public frontend (everything else) ────────────────────────────────────
    location / {
        proxy_pass http://frontend_web;
        proxy_set_header Host $host;
    }
}
