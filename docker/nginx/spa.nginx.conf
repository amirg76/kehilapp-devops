# SPA (single-page app) nginx config — mounted into BOTH frontend containers.
#
# The one line that matters for a React app is `try_files ... /index.html`.
# Without it, refreshing a deep link like /events/42 returns 404, because that
# path is a client-side route, not a real file. This tells nginx: if the file
# isn't on disk, hand back index.html and let React Router sort it out.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip shrinks text assets on the wire — faster first load, free to enable.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────────────────
    # helmet() protects only the API's JSON responses. The HTML the browser
    # actually runs comes from here, and until 2026-09-29 it carried no
    # Content-Security-Policy, no X-Frame-Options and no HSTS (pre-deployment
    # security review). HSTS is set by Caddy, the TLS terminator.
    #
    # The CSP was measured against both built apps in a real browser with the
    # header injected: zero violations, both render, Google Fonts load. Its two
    # concessions: `'unsafe-inline'` for STYLES only (MUI/emotion inject <style>
    # elements at runtime), and one sha256 for the resident app's inline
    # bootstrap script in index.html (`window.global = window; …`). If that
    # script changes, the hash changes and the app stops. Recompute over the
    # script with LF line endings — the browser normalises CRLF to LF before
    # hashing, and a Windows checkout has CRLF on disk (this cost one wrong
    # hash on 29.9). From kehilapp-front-hardened after `npm run build`:
    #   node -e "const h=require('fs').readFileSync('build/index.html','utf8').match(/<script>([^]*?)<\/script>/)[1].replace(/\r\n/g,'\n');console.log('sha256-'+require('crypto').createHash('sha256').update(h).digest('base64'))"
    # Then run kehilapp-media/probes/csp-headers-probe.mjs, which injects this
    # exact policy into both built apps in a real browser and fails on any
    # violation — and fails if its own negative control stops firing.
    # Scripts are otherwise 'self' only: no inline handlers, no third-party JS.
    #
    # NGINX INHERITANCE TRAP: a location block with its own add_header does
    # NOT inherit these. The two locations below that set Cache-Control repeat
    # them on purpose. Add a location with add_header → repeat them there too.
    set $csp "default-src 'self'; script-src 'self' 'sha256-A3woD0FVLdYhW2tIEKqejLK8VXtmLh6qxnoU7cZpqno='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:";
    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build assets (app.4f3a.js) never change content → cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated on purpose — see NGINX INHERITANCE TRAP above.
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # index.html must NEVER be cached, or users get a stale app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Repeated on purpose — see NGINX INHERITANCE TRAP above. This is the
        # response the CSP actually matters on.
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # The SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
