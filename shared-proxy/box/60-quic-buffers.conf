# Installed as /etc/sysctl.d/60-quic-buffers.conf.
# Caddy's HTTP/3 (quic-go) asks for 7 MB UDP buffers and logged "failed to
# sufficiently increase receive buffer size (was: 208 kiB ...)". The value
# follows quic-go's guidance. Takes effect for Caddy at its next start.
net.core.rmem_max=7500000
net.core.wmem_max=7500000
