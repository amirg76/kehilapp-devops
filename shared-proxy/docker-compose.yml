# ─────────────────────────────────────────────────────────────────────────────
# The ONE public entry point of the shared demo box (Hostinger). Decided 2026-10-11.
#
# Every project on the box runs its own compose stack with NO published ports;
# each one joins the box-wide `edge` network and gets a site block under
# sites/<project>.caddy. This Caddy owns 80/443 for the whole machine, fetches
# and renews the Let's Encrypt certificate for every hostname, and forwards by
# hostname. Adding a project = one file in sites/ + `docker compose restart`.
#
# This folder lives in kehilapp-devops because kehilapp is the first tenant;
# it serves the whole box, not only kehilapp. Run it from /opt/shared-proxy
# (runbooks/00) so a `git pull` in a project folder never touches it.
#
#     docker network create edge          # once per box
#     cd /opt/shared-proxy
#     docker compose up -d
#     docker compose exec caddy caddy validate --config /etc/caddy/Caddyfile
#
# Running on the shared box since 2026-10-29 (runbooks/00).
# ─────────────────────────────────────────────────────────────────────────────

name: shared-proxy

services:
  caddy:
    # Pinned minor: X-Forwarded-For from an untrusted client is dropped since
    # Caddy 2.5; a floating "2" tag could also jump a major one day. Bump on purpose.
    # 2.10 → 2.11 on 2026-11-03 for the 2.11.x security fixes. 2.11.6 tightened
    # defaults (16 KiB request headers, 1-minute idle read/write timeouts,
    # headers containing "." dropped) — "Breaking changes" in
    # https://github.com/caddyserver/caddy/releases/tag/v2.11.6. The real
    # Caddyfile + every sites/*.caddy passed `caddy validate` on 2.11.7 before
    # the switch.
    image: caddy:2.11-alpine
    restart: always
    # Container baseline, same as every kehilapp service (docker-compose.prod.yml):
    # no privilege gain, zero capabilities except binding 80/443, bounded
    # memory/processes, rotated logs. Tested with a throwaway container first.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m     # measured 14 MiB / 10 pids with two sites (3.11)
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Let's Encrypt expiry notices go here. Set in /opt/shared-proxy/.env.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /opt/shared-proxy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data        # issued certificates — never delete, or every site re-issues
      - caddy_config:/config
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
