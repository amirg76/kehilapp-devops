# ═════════════════════════════════════════════════════════════════════════════
# Deploy to the AWS SHOWCASE box — manual, one job.
#
# WHERE THIS FITS (decision D-ORC-06 + ADR-1, 2026-09-28):
#   • The always-on demo lives on a shared netcup VPS. It is deployed by hand
#     with the two compose commands in runbooks/02-deploy.md.
#   • AWS is a DEMONSTRATION: `terraform apply` creates a box, this workflow
#     puts the app on it, you verify and record, `terraform destroy` removes
#     it. The evidence is the infrastructure code, not a running server.
#
# Both targets pull the same images, built for x86 AND arm64 by
# build-images.yml (the AWS box is t4g = ARM Graviton, see terraform/).
#
# HISTORY. The first version of this file (31.8) tested, built the backend
# image and SSH-deployed on every push. It ran once and failed: it checked out
# a repo named kehilapp-backend-hardened, which is the local folder name, not
# the GitHub repo. Building now lives in build-images.yml (all three images),
# so this file is only the SSH deploy, run by hand against the box Terraform
# just created.
#
# SECRETS (Repo → Settings → Environments → "aws-showcase"), set after
# `terraform apply`, from its outputs:
#   SSH_HOST          public IP of the box     (terraform output public_ip)
#   SSH_USER          ubuntu
#   SSH_PRIVATE_KEY   the PRIVATE half of the key pair Terraform uploaded
#   SSH_PORT          optional, defaults to 22
# The box itself needs /opt/kehilapp with docker-compose.prod.yml and a filled
# .env — runbooks/01-initial-server-setup.md.
# ═════════════════════════════════════════════════════════════════════════════

name: deploy (AWS showcase)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy: latest, or a short SHA from a build-images run"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A GitHub environment: holds the SSH secrets and can require a click of
    # approval before the job runs.
    environment: aws-showcase
    steps:
      - name: Pull the requested tag and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/kehilapp
            git pull --ff-only || true          # refresh compose/nginx/caddy configs
            export TAG='${{ github.event.inputs.tag }}'
            export REGISTRY=ghcr.io/${{ github.repository_owner }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f               # reclaim disk from old images

      - name: Smoke-check /readyz
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Give it a few seconds, then confirm the backend is ready. Only
            # Caddy (80/443) is published, so probe the backend from INSIDE the
            # docker network instead of a host port.
            sleep 8
            cd /opt/kehilapp
            docker compose -f docker-compose.prod.yml exec -T backend \
              wget -qO- http://127.0.0.1:5001/readyz \
              || (echo "readyz FAILED" && exit 1)
